<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Long Game link preview (1200 x 630)</title>
<!-- The picture that shows when someone posts the link. Render it to src/social/og.png at 1200 x 630 with headless Chrome; the site build copies it in. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=Figtree:wght@500;600;800&display=swap">
<style>
@font-face{font-family:RS;src:url(../../assets/osrs/fonts/runescape.ttf)}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:radial-gradient(120% 150% at 50% -30%,#3a2a1f 0,#1b1411 46%,#100d0b 82%);color:#f0e2c4;font:500 22px/1.3 Figtree,sans-serif;-webkit-font-smoothing:antialiased}
.brand{position:absolute;left:48px;top:40px;display:flex;align-items:center;gap:14px}
.tile{width:60px;height:60px;border-radius:22%;background:#ffff00;display:grid;place-items:center}
.wm{font:800 44px/1 Poppins;letter-spacing:-.045em;padding-bottom:.2em}
.wm span{display:inline-block;position:relative;top:.215em;color:#ffff00}
h1{position:absolute;left:48px;top:128px;margin:0;font:800 58px/1.02 Figtree;letter-spacing:-.025em;color:#fff}
p{position:absolute;left:48px;top:204px;margin:0;color:#b9ab92;font-size:25px}
.rail{position:absolute;left:24px;right:24px;top:290px;height:8px;border-radius:3px;background:linear-gradient(#d9b56a,#b08a45 45%,#6f5425);box-shadow:0 2px 0 rgba(0,0,0,.6)}
.c{position:absolute;top:283px;width:92px;height:179px}
.c img{position:absolute;inset:0;width:100%;height:100%}
.c .dim{filter:brightness(.34) saturate(.12)}
.c .lit{clip-path:inset(calc(100% - var(--p)) 0 0 0)}
.c b{position:absolute;left:0;right:0;top:196px;text-align:center;font:16px/1 RS;font-weight:400;-webkit-font-smoothing:none;color:#ffff00;text-shadow:1px 1px 0 #000}
.c.max{filter:drop-shadow(0 0 10px rgba(255,214,90,.6))}
.c.goal b{color:#fff}
.foot{position:absolute;left:48px;right:48px;bottom:34px;display:flex;align-items:baseline;gap:18px}
.foot b{font-weight:600;color:#f0e2c4;font-size:24px}
.foot span{color:#b9ab92}
.foot i{margin-left:auto;font-style:normal;color:#b9ab92;font-size:17px}
</style></head><body>
<div class="brand"><div class="tile"><svg width="46" height="46" viewBox="0 0 64 64"><g fill="none" stroke-width="9.5"><circle cx="32" cy="26" r="14" stroke="#7d7a0a"/><path d="M46 26V37c0 9.5-6 15-15 15h-5" stroke="#7d7a0a"/><path d="M32 12A14 14 0 1 1 18 26" stroke="#16120f"/></g></svg></div><div class="wm">lon<span>9</span> <span>9</span>ame</div></div>
<h1>How far are you from max?</h1>
<p>Type your name. All 24 skillcapes, filling toward 99.</p>
<div class="rail"></div>
<div id="capes"></div>
<div class="foot"><b>longgame.tools</b><span>Free OSRS maxing planner</span><i>A fan project. Not affiliated with Jagex.</i></div>
<script>
const ks=['sailing','prayer','construction','farming','ranged','herblore','smithing','mining','fletching','crafting','attack','slayer','magic','defence','woodcutting','hitpoints','agility','cooking','strength','hunter','fishing','firemaking','runecraft','thieving'];
const n=ks.length,x0=44,pitch=(956-92)/(n-1),A='../../assets/osrs/capes-md/';
let h=ks.map((k,i)=>{const l=i===n-1?99:Math.round(30+i*(66/(n-1))),src=A+k+(l>=99?'_t':'')+'.webp';
  return '<div class="c'+(l>=99?' max':'')+'" style="left:'+Math.round(x0+i*pitch)+'px;--p:'+((l-1)/98*100).toFixed(1)+'%"><img class="dim" src="'+src+'" alt=""><img class="lit" src="'+src+'" alt=""><b>'+l+'</b></div>';}).join('');
h+='<div class="c goal" style="left:1056px;width:96px;height:186px;--p:38%"><img class="dim" src="'+A+'max.webp" alt=""><img class="lit" src="'+A+'max.webp" alt=""><b style="top:196px">Max cape</b></div>';
document.getElementById('capes').innerHTML=h;
</script></body></html>
