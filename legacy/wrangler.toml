# Long Game on Cloudflare: one Worker serves the static site in ./site and answers /api/*.
# Build the site first:   python tools/build_site.py
# Deploy:                 npx wrangler deploy
# Secret for suggestions: npx wrangler secret put GITHUB_TOKEN   (a fine-grained token with Issues: write on the one repo)
name = "longgame"
main = "relay/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
SITE_URL = "https://longgame.tools"
GITHUB_REPO = "ryandewick/longgame"   # the repository that receives suggestions
