<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Long Game, a free maxing planner for Old School RuneScape, is offline for now."
    />
    <title>Long Game</title>
    <link rel="canonical" href="https://longgame.tools/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Long Game",
        "alternateName": ["Long Game OSRS", "longgame.tools"],
        "url": "https://longgame.tools/"
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/wordmark.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: Wordmark;
        font-weight: 800;
        font-display: block;
        src: url(/fonts/wordmark.woff2) format('woff2');
      }
      @font-face {
        font-family: Figtree;
        font-weight: 300 900;
        font-display: block;
        src: url(/fonts/figtree.woff2) format('woff2');
      }
      :root {
        color-scheme: dark;
        --stage: #100d0b;
        --falloff: #1b1411;
        --glow: #3a2a1f;
        --bone: #f0e2c4;
        --ink-2: #b9ab92;
        --stat: #ffff00;
        --close: 0.074em;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: radial-gradient(
            ellipse 80% 70% at 50% -10%,
            var(--glow) 0%,
            var(--falloff) 55%,
            var(--stage) 100%
          )
          var(--stage);
        color: var(--bone);
        font:
          16px/1.5 Figtree,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      ::selection {
        background: var(--stat);
        color: #16120f;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      main {
        position: relative;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 6vh;
      }

      /* The wordmark, as the app sets it. The box clips just under the descenders, so letters can rise in from below it. */
      .wordmark {
        display: flex;
        font:
          800 clamp(46px, 7.4vw, 68px)/1 Wordmark,
          sans-serif;
        letter-spacing: -0.045em;
        color: var(--bone);
        white-space: pre;
        padding: 0.12em 0.1em 0.3em;
        margin-bottom: -0.3em;
        overflow: hidden;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .wordmark span {
        display: inline-block;
      }
      /* A counter wheel: a window from just over the x-height down past the descenders, a g in it, and a yellow 9 waiting below, dropped like a g. */
      .slot {
        position: relative;
        padding-bottom: 0.3em;
        margin-bottom: -0.3em;
        vertical-align: top;
        clip-path: inset(0.27em -0.05em 0 -0.05em);
      }
      .wheel {
        position: relative;
      }
      .nine {
        position: absolute;
        left: 0;
        top: calc(1.2em + 0.215em);
        color: var(--stat);
      }
      /* Pointing at the wordmark: each counter lifts a touch, window and all, so nothing is cut. */
      .nudge {
        transition: transform 0.38s cubic-bezier(0.3, 0.7, 0.3, 1);
      }
      .after1 .nudge {
        transition-delay: 0.04s;
      }
      @media (hover: hover) {
        .ready .wordmark:not(.busy):hover .nudge {
          transform: translateY(-0.075em);
        }
      }

      .copy {
        margin-top: 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 3px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.005em;
        color: #fff;
      }
      .copy p {
        margin: 0;
        font-size: 15px;
        color: var(--ink-2);
      }

      /* Before the first frame: letters below the line, words hidden. With reduced motion, the end state. */
      .js .rise {
        transform: translateY(1.2em);
      }
      .js .copy {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .js .rise {
          transform: none;
        }
        .js .copy {
          opacity: 1;
        }
        .wheel {
          transform: translateY(-1.2em);
        }
        .after1 {
          transform: translateX(calc(-1 * var(--close)));
        }
        .after2 {
          transform: translateX(calc(-1 * var(--close)));
        }
        .wordmark {
          transform: translateX(var(--close));
        }
      }
    </style>
    <script>
      document.documentElement.className = 'js'
    </script>
  </head>
  <body>
    <main>
      <div class="wordmark" role="img" aria-label="Long Game">
        <span class="rise">l</span><span class="rise">o</span><span class="rise">n</span
        ><span class="nudge"
          ><span class="rise slot"
            ><span class="wheel">g<span class="nine">9</span></span></span
          ></span
        ><span class="after1"
          ><span> </span
          ><span class="nudge"
            ><span class="rise slot"
              ><span class="wheel">g<span class="nine">9</span></span></span
            ></span
          ><span class="after2"
            ><span class="rise">a</span><span class="rise">m</span><span class="rise">e</span></span
          ></span
        >
      </div>
      <div class="copy">
        <h1>Long Game is offline</h1>
        <p>Thanks to everyone who tried it.</p>
      </div>
    </main>
    <script>
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches
      const $ = (q) => document.querySelector(q),
        $$ = (q) => [...document.querySelectorAll(q)]
      const mark = $('.wordmark'),
        wheels = $$('.wheel'),
        afters = [$('.after1'), $('.after2')],
        copy = $('.copy')

      const RISE = 'cubic-bezier(.2,.75,.25,1)' // quick off the line, long soft landing
      const WHEEL = 'cubic-bezier(.75,0,.25,1)' // a counter wheel: slow off, fast through, slow in
      const SETTLE = 'cubic-bezier(.3,0,.3,1)'
      const TICK = 1300 // ms: when the counters turn, after a short beat on "long game"

      const run = (el, frames, opts) => el.animate(frames, { fill: 'both', ...opts })

      // The g's tick over into 9s, each wheel running a hair past its stop and clicking back;
      // the letters after each one close up by the width a 9 saves.
      function tick(toNines, delay) {
        wheels.forEach((w, k) => {
          const [a, b] = toNines ? ['0', '-1.2em'] : ['-1.2em', '0']
          run(
            w,
            [
              { transform: `translateY(${a})`, easing: WHEEL },
              {
                transform: `translateY(calc(${b} ${toNines ? '-' : '+'} .045em))`,
                offset: 0.84,
                easing: SETTLE,
              },
              { transform: `translateY(${b})` },
            ],
            { delay: delay + k * 90, duration: 640 },
          )
          const [x, y] = toNines
            ? ['0px', 'calc(-1 * var(--close))']
            : ['calc(-1 * var(--close))', '0px']
          run(afters[k], [{ transform: `translateX(${x})` }, { transform: `translateX(${y})` }], {
            delay: delay + k * 90,
            duration: 560,
            easing: WHEEL,
          })
        })
        // keep the whole word centred as it closes up
        run(
          mark,
          [
            { transform: `translateX(${toNines ? '0px' : 'var(--close)'})` },
            { transform: `translateX(${toNines ? 'var(--close)' : '0px'})` },
          ],
          { delay, duration: 650, easing: WHEEL },
        )
      }

      let busy = false
      if (!still) {
        document.fonts.ready.then(() => {
          $$('.rise').forEach((el, i) =>
            run(el, [{ transform: 'translateY(1.2em)' }, { transform: 'translateY(0)' }], {
              delay: 120 + i * 38,
              duration: 780,
              easing: RISE,
            }),
          )
          tick(true, TICK)
          setTimeout(() => document.body.classList.add('ready'), TICK + 900)
          run(
            copy,
            [
              { opacity: 0, transform: 'translateY(6px)' },
              { opacity: 1, transform: 'none' },
            ],
            { delay: TICK + 520, duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' },
          )
        })
        // a click turns the counters back to g's and over again
        mark.addEventListener('click', () => {
          if (busy || !document.body.classList.contains('ready')) return
          busy = true
          mark.classList.add('busy')
          tick(false, 0)
          setTimeout(() => {
            tick(true, 0)
            setTimeout(() => {
              busy = false
              mark.classList.remove('busy')
            }, 800)
          }, 900)
        })
      }

      // The stage light from the app's rack, as a small shader so the gradient never bands: warm light
      // from above, breathing slowly, leaning toward the pointer, with a fine grain.
      ;(() => {
        const canvas = document.createElement('canvas'),
          gl = canvas.getContext('webgl', { antialias: false, alpha: false })
        if (!gl) return
        canvas.setAttribute('aria-hidden', 'true')
        const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'
        const fs = `precision mediump float;uniform vec2 r;uniform float t;uniform vec2 m;
    const vec3 stage=vec3(16.,13.,11.)/255.,fall=vec3(27.,20.,17.)/255.,glow=vec3(60.,44.,32.)/255.;
    float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){
      vec2 uv=gl_FragCoord.xy/r;
      vec2 c=vec2(.5+m.x*.06,1.12+m.y*.02);
      vec2 d=uv-c;d.x*=(r.x/r.y)*.5;
      float l=smoothstep(1.2,0.,length(d))*(.97+.03*sin(t*.5));
      vec3 col=mix(stage,fall,smoothstep(0.,.75,l));
      col=mix(col,glow,pow(l,2.1));
      col+=(h(gl_FragCoord.xy+fract(t*.37)*97.)-.5)*(2.2/255.);
      gl_FragColor=vec4(col,1.);
    }`
        const sh = (type, src) => {
          const s = gl.createShader(type)
          gl.shaderSource(s, src)
          gl.compileShader(s)
          return s
        }
        const prog = gl.createProgram()
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs))
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs))
        gl.linkProgram(prog)
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return
        document.body.prepend(canvas)
        gl.useProgram(prog)
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
        const loc = gl.getAttribLocation(prog, 'p')
        gl.enableVertexAttribArray(loc)
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
        const R = gl.getUniformLocation(prog, 'r'),
          T = gl.getUniformLocation(prog, 't'),
          M = gl.getUniformLocation(prog, 'm')
        const target = { x: 0, y: 0 },
          mouse = { x: 0, y: 0 }
        addEventListener('pointermove', (e) => {
          target.x = (e.clientX / innerWidth) * 2 - 1
          target.y = -((e.clientY / innerHeight) * 2 - 1)
        })
        function size() {
          canvas.width = innerWidth
          canvas.height = innerHeight
          gl.viewport(0, 0, canvas.width, canvas.height)
        }
        addEventListener('resize', size)
        size()
        const t0 = performance.now()
        ;(function frame(now) {
          mouse.x += (target.x - mouse.x) * 0.035
          mouse.y += (target.y - mouse.y) * 0.035
          gl.uniform2f(R, canvas.width, canvas.height)
          gl.uniform1f(T, still ? 0 : (now - t0) / 1000)
          gl.uniform2f(M, mouse.x, mouse.y)
          gl.drawArrays(gl.TRIANGLES, 0, 3)
          requestAnimationFrame(frame)
        })(t0)
      })()
    </script>
  </body>
</html>
